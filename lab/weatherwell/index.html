<script>
// #solo=N renders one screen edge to edge (for exporting stills to the case page)
(function () {
  if (/[?&]flat/.test(location.search)) document.body.classList.add('flat');
  var m = location.hash.match(/solo=(\d+)/); if (!m) return;
  var figs = document.querySelectorAll('.board > .slot'), n = +m[1] - 1;
  document.body.classList.add('solo');
  figs.forEach(function (f, i) { if (i !== n) f.remove(); });
})();

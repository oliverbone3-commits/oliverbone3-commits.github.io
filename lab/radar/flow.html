<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Radar storm flow</title>
<link rel="stylesheet" href="radar.css">
<style>
  body { background: #0E0F12; color: #fff; min-height: 100vh; }
  .wrap { display: grid; grid-template-columns: auto minmax(280px, 400px); gap: 56px; align-items: center; justify-content: center; min-height: 100vh; padding: 24px; }
  .stage { position: relative; }
  .stage .phone { position: relative; background: #000; box-shadow: 0 0 0 1px rgb(255 255 255 / .1), 0 40px 80px -20px rgb(0 0 0 / .7); transform-origin: top left; }
  .stage .screen { position: absolute; inset: 0; visibility: hidden; }
  .stage .screen.on { visibility: visible; }
  .hot { position: absolute; z-index: 60; border-radius: 22px; cursor: pointer; background: transparent; }
  .hot::after { content: ""; position: absolute; inset: -4px; border-radius: inherit; border: 2px solid #4DA3FF; box-shadow: 0 0 0 4px rgb(77 163 255 / .25); animation: pulse 1.4s ease-in-out infinite; }
  @keyframes pulse { 0%,100% { opacity: .35; transform: scale(1); } 50% { opacity: 1; transform: scale(1.03); } }
  .ripple { position: absolute; z-index: 61; width: 24px; height: 24px; margin: -12px 0 0 -12px; border-radius: 50%; background: rgb(255 255 255 / .55); pointer-events: none; animation: rip .42s ease-out forwards; }
  @keyframes rip { from { transform: scale(.4); opacity: .9; } to { transform: scale(4); opacity: 0; } }
  @media (prefers-reduced-motion: reduce) { .hot::after, .ripple { animation: none; } }

  /* Lock screen */
  .lock { background: #05070C; }
  .lock .wall { position: absolute; inset: 0; width: 402px; height: 874px; object-fit: cover; }
  .lock .shade { position: absolute; inset: 0; background: linear-gradient(rgb(0 0 0 / .15), rgb(0 0 0 / .05) 40%, rgb(0 0 0 / .55)); }
  .lock .date { position: absolute; top: 96px; left: 0; right: 0; text-align: center; font-size: 20px; font-weight: 590; color: rgb(255 255 255 / .85); }
  .lock .clock { position: absolute; top: 116px; left: 0; right: 0; text-align: center; font-size: 104px; line-height: 110px; font-weight: 600; letter-spacing: -2px; color: rgb(255 255 255 / .92); font-variant-numeric: tabular-nums; }
  .lock .qa { position: absolute; bottom: 52px; width: 50px; height: 50px; border-radius: 50%; display: grid; place-items: center; background: rgb(30 30 34 / .5); -webkit-backdrop-filter: blur(16px); backdrop-filter: blur(16px); color: #fff; }
  .lock .qa svg { width: 22px; height: 22px; }
  .note { position: absolute; z-index: 45; left: 10px; right: 10px; border-radius: 24px; padding: 12px 14px; display: flex; gap: 11px; align-items: flex-start;
    background: rgb(44 44 48 / .72); -webkit-backdrop-filter: blur(24px) saturate(180%); backdrop-filter: blur(24px) saturate(180%); box-shadow: inset 0 0 0 1px rgb(255 255 255 / .12), 0 10px 30px rgb(0 0 0 / .4); color: #fff; }
  .note .app { width: 38px; height: 38px; border-radius: 9px; background: #FF4245; display: grid; place-items: center; flex: none; }
  .note .app svg { width: 22px; height: 22px; color: #fff; }
  .note b { display: flex; justify-content: space-between; font-size: 15px; line-height: 20px; font-weight: 590; }
  .note b span { font-weight: 400; font-size: 13px; color: rgb(235 235 245 / .6); }
  .note p { font-size: 15px; line-height: 20px; color: rgb(235 235 245 / .85); }
  .note.drop { animation: drop .6s cubic-bezier(.2,.9,.25,1.15) both; }
  @keyframes drop { from { transform: translateY(-40px) scale(.96); opacity: 0; } to { transform: none; opacity: 1; } }

  .panel .eyebrow { font-size: 13px; font-weight: 590; letter-spacing: .4px; color: #4DA3FF; text-transform: uppercase; }
  .panel h1 { margin-top: 8px; font-size: 28px; line-height: 34px; font-weight: 700; letter-spacing: -.3px; }
  .panel .story { margin-top: 14px; font-size: 19px; line-height: 27px; color: rgb(235 235 245 / .92); min-height: 108px; }
  .panel .hint { margin-top: 10px; font-size: 14px; color: rgb(235 235 245 / .55); display: flex; gap: 6px; align-items: center; }
  .panel .hint i { width: 10px; height: 10px; border-radius: 50%; border: 2px solid #4DA3FF; }
  .ctrl { display: flex; gap: 10px; align-items: center; margin-top: 26px; }
  .ctrl button { height: 44px; padding: 0 18px; border-radius: 22px; background: rgb(255 255 255 / .1); color: #fff; font-size: 15px; font-weight: 590; }
  .ctrl button:disabled { opacity: .35; cursor: default; }
  .ctrl .count { margin-left: 6px; font-size: 14px; color: rgb(235 235 245 / .55); font-variant-numeric: tabular-nums; }
  .chapters { list-style: none; margin-top: 28px; display: grid; gap: 2px; }
  .chapters li { display: flex; gap: 10px; align-items: baseline; padding: 7px 10px; border-radius: 10px; font-size: 14px; line-height: 19px; color: rgb(235 235 245 / .5); cursor: pointer; }
  .chapters li em { font-style: normal; width: 18px; text-align: right; font-variant-numeric: tabular-nums; }
  .chapters li.done { color: rgb(235 235 245 / .75); }
  .chapters li.on { background: rgb(77 163 255 / .14); color: #fff; }
  @media (max-width: 860px) { .wrap { grid-template-columns: 1fr; gap: 24px; justify-items: center; padding: 16px; } .panel { max-width: 402px; } .chapters { display: none; } }

  /* ?embed — inside the case page: phone, caption and player controls, no side panel */
  #emb { display: none; }
  .fl-embed { background: transparent; min-height: 0; height: 100vh; overflow: hidden; }
  .fl-embed .wrap { grid-template-columns: 1fr; justify-items: center; align-content: start; gap: 16px; min-height: 0; padding: 24px 16px 20px; }
  .fl-embed .panel { display: none; }
  .fl-embed #emb { display: grid; }
  .fl-embed .hot { cursor: default; }
  .fl-embed .hot::after { display: none; }
  .fl-embed .stage .phone { box-shadow: 0 0 0 1px rgb(0 0 0 / .06), 0 30px 60px -20px rgb(20 20 15 / .35); }
  .fl-embed.fl-dark .stage .phone { box-shadow: 0 0 0 1px rgb(255 255 255 / .08), 0 30px 60px -20px rgb(0 0 0 / .6); }
  @font-face { font-family: "Inter"; src: url("../../assets/fonts/inter-latin.woff2") format("woff2"); font-weight: 100 900; font-display: swap; }
  .fl-controls { width: 520px; max-width: calc(100vw - 32px); gap: 10px; }
  .fl-caption { min-height: 44px; text-align: center; font: 17px/22px "Inter", system-ui, sans-serif; letter-spacing: -.01em; color: #16161A; text-wrap: balance; }
  .fl-bar { display: flex; align-items: center; gap: 8px; }
  .fl-btn { height: 36px; min-width: 36px; padding: 0 10px; border-radius: 18px; background: #fff; display: inline-flex; align-items: center; justify-content: center; gap: 6px; font: 590 15px "Inter", system-ui, sans-serif; color: #16161A; box-shadow: 0 1px 2px rgb(20 20 15 / .1); }
  .fl-btn svg { width: 18px; height: 18px; }
  .fl-btn:disabled { opacity: .4; cursor: default; }
  .fl-play { padding: 0 14px 0 12px; }
  .fl-progress { flex: 1; display: flex; gap: 4px; }
  .fl-progress button { flex: 1; height: 4px; border-radius: 2px; background: rgb(20 20 15 / .14); padding: 0; }
  .fl-progress button.done { background: rgb(20 20 15 / .45); }
  .fl-progress button.cur { background: #0088FF; }
  .fl-count { font: 13px "Inter", system-ui, sans-serif; color: rgb(20 20 15 / .55); font-variant-numeric: tabular-nums; min-width: 40px; text-align: right; }
  .fl-dark .fl-caption { color: #F2F3F8; }
  .fl-dark .fl-btn { background: rgb(255 255 255 / .1); color: #F2F3F8; box-shadow: none; }
  .fl-dark .fl-count { color: rgb(242 243 248 / .6); }
  .fl-dark .fl-progress button { background: rgb(255 255 255 / .16); }
  .fl-dark .fl-progress button.done { background: rgb(255 255 255 / .45); }
  .cursor { position: absolute; left: 0; top: 0; z-index: 90; width: 38px; height: 38px; margin: -19px 0 0 -19px; border-radius: 50%; background: rgb(12 12 12 / .18); border: 2px solid rgb(255 255 255 / .92); box-shadow: 0 2px 8px rgb(0 0 0 / .25); opacity: 0; pointer-events: none; transition: transform .55s cubic-bezier(.3,.7,.3,1), opacity .25s; }
  .cursor.show { opacity: 1; }

  /* ?shot — bare 402×874 screen for exporting case images */
  .shot { background: #000; }
  .shot .wrap { display: block; padding: 0; min-height: 0; }
  .shot .panel, .shot #emb, .shot .hot { display: none !important; }
  .shot .stage .phone { position: fixed; left: 0; top: 0; margin: 0; border-radius: 0; box-shadow: none; transform: none !important; }
  /* Narrow screens: the bar must not push the column wider than the frame (UA borders on the step buttons did). */
  .fl-controls { grid-template-columns: minmax(0, 1fr); }
  .fl-bar { min-width: 0; }
  .fl-btn { border: 0; flex: none; }
  .fl-progress { min-width: 0; }
  .fl-progress button { min-width: 0; border: 0; }
  @media (max-width: 360px) { .fl-count { display: none; } .fl-bar { gap: 6px; } }
</style>
</head>
<body>
<div class="wrap">
  <div class="stage" id="stage"><div class="phone" id="phone"></div></div>
  <section class="panel" aria-live="polite">
    <p class="eyebrow">Radar · one storm, start to finish</p>
    <h1 id="title"></h1>
    <p class="story" id="cap"></p>
    <p class="hint"><i></i>Tap the highlighted spot, or use the arrow keys</p>
    <div class="ctrl"><button id="prev" type="button">Back</button><button id="next" type="button">Next</button><span class="count" id="count"></span></div>
    <ol class="chapters" id="chapters"></ol>
  </section>
  <div class="fl-controls" id="emb">
    <p class="fl-caption" aria-live="polite"></p>
    <div class="fl-bar">
      <button type="button" class="fl-btn" data-fl="prev" aria-label="Previous step"><svg viewBox="0 0 24 24"><path d="M15 6l-6 6 6 6" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
      <button type="button" class="fl-btn fl-play" data-fl="play"></button>
      <button type="button" class="fl-btn" data-fl="next" aria-label="Next step"><svg viewBox="0 0 24 24"><path d="M9 6l6 6-6 6" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
      <div class="fl-progress"></div>
      <span class="fl-count"></span>
    </div>
  </div>
</div>

    done.push(A.animate([{ transform: 'none', borderRadius: '0' }, { transform: 'translateY(100%)', borderRadius: '40px' }], { duration: d, easing: 'cubic-bezier(.4,0,.8,.6)' }));
  } else if (kind === 'open') { z(B, 2); z(A, 1);
    done.push(B.animate([{ transform: 'scale(.86) translateY(-60px)', opacity: 0, borderRadius: '40px' }, { transform: 'none', opacity: 1, borderRadius: '0' }], { duration: d + 40, easing: EASE }));
  } else { z(B, 2); z(A, 1);
    done.push(B.animate([{ opacity: 0 }, { opacity: 1 }], { duration: 240 }));
  }
  // animations can stall when the tab isn't painting (background tab, hidden pane): finish them on a timer
  const cap = new Promise(r => setTimeout(r, wait));
  return Promise.race([Promise.all(anims.map(a => a.finished)), cap]).then(() => {
    anims.forEach(a => { try { a.finish(); a.cancel(); } catch (e) {} });
    A.style.zIndex = B.style.zIndex = ''; screens.forEach((s, k) => show(k, k === to));
  });
}

function placeHot() {
  if (hot) hot.remove();
  const st = STEPS[i], t = screens[st.s].querySelector(st.hot);
  if (!t) return;
  const pr = phone.getBoundingClientRect(), r = t.getBoundingClientRect(), k = pr.width / 402;
  hot = document.createElement('button');
  hot.className = 'hot'; hot.type = 'button';
  hot.setAttribute('aria-label', STEPS[i + 1] ? 'Next: ' + STEPS[i + 1].title : 'Start over');
  Object.assign(hot.style, { left: (r.left - pr.left) / k + 'px', top: (r.top - pr.top) / k + 'px', width: r.width / k + 'px', height: r.height / k + 'px' });
  const rad = getComputedStyle(t).borderRadius; if (rad && rad !== '0px') hot.style.borderRadius = rad;
  hot.addEventListener('click', e => {
    if (EMBED) pause();
    const pr2 = phone.getBoundingClientRect(), k2 = pr2.width / 402, rip = document.createElement('span');
    rip.className = 'ripple';
    rip.style.left = (e.clientX - pr2.left) / k2 + 'px';
    rip.style.top = (e.clientY - pr2.top) / k2 + 'px';
    phone.appendChild(rip); setTimeout(() => rip.remove(), 450);
    setTimeout(() => go(i + 1), 160);
  });
  phone.appendChild(hot);
}

function text() {
  const st = STEPS[i];
  document.getElementById('title').textContent = st.title;
  document.getElementById('cap').textContent = st.cap;
  document.getElementById('count').textContent = (i + 1) + ' / ' + STEPS.length;
  document.getElementById('prev').disabled = i === 0;
  document.getElementById('next').textContent = i === STEPS.length - 1 ? 'Start over' : 'Next';
  let chap = 0; STEPS.forEach((s, n) => { if (s.ch && n <= i) chap = n; });
  document.querySelectorAll('#chapters li').forEach(li => { const n = +li.dataset.n; li.classList.toggle('on', n === chap); li.classList.toggle('done', n < chap); });
}

function go(n) {
  if (busy) return Promise.resolve();
  n = (n + STEPS.length) % STEPS.length;
  const forward = n === i + 1, from = STEPS[i].s;
  i = n; busy = true;
  if (hot) { hot.remove(); hot = null; }
  const st = STEPS[i];
  text();
  if (!forward) applyState(st);
  ui();
  return transition(from, st.s, forward ? st.enter : 'fade').then(() => {
    if (forward) {
      applyState(st);
      if (st.enter === 'none' && st.alert && !st.bell) pop(screens[1].querySelector('.sheet .btn-tinted'));
      if (st.enter === 'none' && st.bell) pop(screens[5].querySelector('.place:nth-of-type(3) .bell'));
    }
    if (i === 0) { const nt = screens[8].querySelector('.note'); nt.classList.remove('drop'); void nt.offsetWidth; nt.classList.add('drop'); }
    busy = false; setTimeout(placeHot, i === 0 ? 600 : 0);
  });
}

function fit() {
  if (SHOT) return;
  const k = Math.min(1, (window.innerHeight - (EMBED ? 190 : 48)) / 874, (window.innerWidth - 32) / 402);
  phone.style.transform = `scale(${k})`;
  phone.parentElement.style.width = 402 * k + 'px';
  phone.parentElement.style.height = 874 * k + 'px';
  if (screens.length && !busy) placeHot();
}

(function init() {
  const doc = document.getElementById('board').content;
  const sprite = doc.querySelector('svg');
  document.body.prepend(document.importNode(sprite, true));
  document.querySelector('body > svg defs').insertAdjacentHTML('beforeend', '<symbol id="i-bolt" viewBox="0 0 24 24"><path d="M13 2 4 14h7l-1 8 9-12h-7l1-8Z" fill="currentColor"/></symbol><symbol id="i-cam" viewBox="0 0 24 24"><path d="M4 7h3l2-2.5h6L17 7h3a1 1 0 0 1 1 1v10a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1V8a1 1 0 0 1 1-1Z" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/><circle cx="12" cy="13" r="3.5" fill="none" stroke="currentColor" stroke-width="2"/></symbol>');
  Array.from(doc.children).filter(el => el.classList.contains('screen')).forEach(s => { const c = document.importNode(s, true); darken(c); phone.appendChild(c); screens.push(c); });
  const lock = lockScreen(); phone.appendChild(lock); screens.push(lock);
  lock.querySelector('.sb-slot').replaceWith(screens[0].querySelector('.status .sb').cloneNode(true));
  // storms are a layer of the same map: same toolbar and map tools, the layer pill reads Storms
  const tb0 = screens[0].querySelector('.toolbar'), tb1 = screens[1].querySelector('.toolbar');
  const tb = tb0.cloneNode(true);
  tb.querySelector('.pill-btn').innerHTML = '<svg style="color:var(--storm)"><use href="#i-hurricane"/></svg>Storms<svg class="s14 l2"><use href="#i-chev-d"/></svg>';
  tb1.replaceWith(tb);
  const tools = screens[0].querySelector('.map-tools').cloneNode(true);
  tools.querySelector('.vgroup button:nth-child(2)').classList.add('on');
  screens[1].appendChild(tools);
  const chips = screens[1].querySelector('.chips'); if (chips) chips.style.top = '116px';
  // in the storm layer the map pans to the Gulf and a bit left, clear of the map tools
  const wrapOf = el => el.querySelector(':scope > div[style*="transform"]');
  wrapOf(screens[1]).style.transform = 'translate(-40px, -170px)';
  // a sheet sits over the map it was opened from: reuse that screen's map layer
  [[1, 2], [0, 3], [0, 5], [0, 6]].forEach(([from, to]) => { const w = wrapOf(screens[to]), src = wrapOf(screens[from]); if (w && src) w.replaceWith(src.cloneNode(true)); });
  // the warning opens as a modal from the notification: close (×) instead of back
  const wb = screens[4].querySelector('.toolbar .circle-btn use'); if (wb) wb.setAttribute('href', '#i-x');
  phone.querySelectorAll('[data-bars]').forEach(el => { el.innerHTML = el.dataset.bars.split(',').map(v => +v ? `<i style="height:${v}px"></i>` : '<i class="f"></i>').join(''); });
  const ol = document.getElementById('chapters');
  STEPS.forEach((st, n) => { if (!st.ch) return; const li = document.createElement('li'); li.dataset.n = n; li.innerHTML = `<em>${ol.children.length + 1}</em>${st.ch}`; li.addEventListener('click', () => go(n)); ol.appendChild(li); });
  document.getElementById('prev').addEventListener('click', () => go(i - 1));
  document.getElementById('next').addEventListener('click', () => go(i + 1));
  document.addEventListener('keydown', e => { if (e.key === 'ArrowRight') go(i + 1); if (e.key === 'ArrowLeft') go(i - 1); });
  window.addEventListener('resize', fit);
  screens.forEach((s, k) => show(k, k === STEPS[0].s));
  fit(); text(); applyState(STEPS[0]);
  const nt = lock.querySelector('.note'); nt.classList.add('drop');
  const deep = +(location.hash.match(/^#(\d+)$/) || [])[1];
  if (deep > 1 && deep <= STEPS.length) { i = deep - 1; screens.forEach((s, k) => show(k, k === STEPS[i].s)); text(); applyState(STEPS[i]); }
  setTimeout(placeHot, 650);
  cursor = document.createElement('div'); cursor.className = 'cursor'; phone.appendChild(cursor);
  embProg.innerHTML = STEPS.map((_, n) => `<button type="button" aria-label="Step ${n + 1}"></button>`).join('');
  embProg.addEventListener('click', e => { const b = e.target.closest('button'); if (b) { pause(); go(Array.prototype.indexOf.call(embProg.children, b)); } });
  bPlay.addEventListener('click', () => playing ? pause() : play());
  bPrev.addEventListener('click', () => { pause(); go(i - 1); });
  bNext.addEventListener('click', () => { pause(); go(i + 1); });
  ui(); ready = true;
  if (EMBED && wantPlay && !started && !reduce) { started = true; play(); }
})();
</script>
